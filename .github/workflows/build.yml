name: build

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  freenove-fnk0104ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('upstream.lock', 'patches/*.patch', 'requirements.txt') }}

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Bootstrap upstream + patches
        run: ./scripts/bootstrap.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-Freenove-FNK0104AB
          path: |
            dist/Bruce-Freenove-FNK0104AB.bin
            dist/SHA256SUMS
          retention-days: 14
